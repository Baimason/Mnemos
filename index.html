    function(L){ var a = [ri(1,5), ri(1,5)]; while(a.length<6) a.push(a[a.length-1]+a[a.length-2]);

    function(L){ var s = ri(1,10), a = [s], i, x = ri(2,9), y = ri(1,4); for(i=0;i<6;i++) a.push(i%2===0 ? a[a.length-1]+x : a[a.length-1]-y);

    function(L){ var s = ri(1,10), inc = ri(1,3), a = [s], d = ri(1,4);

    function(L){ var s = ri(2,6), a = [s]; for(var i=0;i<4;i++) a.push(a[a.length-1]*2+1);
      return {q:"Sigue la serie: "+a.join(", ")+", ?", a:a[4]*2+1, min:3, tip:"Cada número es el anterior × 2 + 1. Si ni diferencias ni cocientes son constantes, prueba combinaciones simples."}; }
  ]
};
function calcProblem(cat, L){
  var cats = cat==="all" ? ["money","mult","conv","seq"] : [cat], pool = [];
  cats.forEach(function(c){ CALC_GEN[c].forEach(function(g){ pool.push({c:c, g:g}); }); });
  for(var t=0; t<40; t++){ var p = pick(pool), r = p.g(L); if((r.min||1) <= L){ r.cat = p.c; return r; } }
  r = CALC_GEN.mult[1](1); r.cat = "mult"; return r;
}

/* Progreso del Observador */
function seriesChart(vals, color, label, unit){
  if(vals.length<2) return '<p class="small muted">'+label+': aparece cuando tengas al menos 2 intentos.</p>';
  var data = vals.slice(-40), Wd=400, H=150, ml=36, mr=10, mt=10, mb=20, max = 0;
  data.forEach(function(v){ max = Math.max(max, v); }); max = max<=0 ? 1 : max*1.1;
  function x(i){ return ml + i*(Wd-ml-mr)/(data.length-1); }
  function y(v){ return mt + (H-mt-mb)*(1-v/max); }
  var g = "";
  [0, max/2, max].forEach(function(v){ g += '<line x1="'+ml+'" x2="'+(Wd-mr)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="var(--line)"/><text x="'+(ml-6)+'" y="'+(y(v)+3).toFixed(1)+'" text-anchor="end">'+(v<10&&v>0?v.toFixed(1):Math.round(v))+'</text>'; });
  data.forEach(function(v,i){ g += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="2.6" fill="'+color+'" fill-opacity=".35"/>'; });
  var ma = data.map(function(_,i){ var s = data.slice(Math.max(0,i-6), i+1); return avg(s); });
  g += '<path d="'+ma.map(function(v,i){ return (i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1); }).join(" ")+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round"/>';
  g += '<text x="'+ml+'" y="'+(H-5)+'">intento 1</text><text x="'+(Wd-mr)+'" y="'+(H-5)+'" text-anchor="end">intento '+data.length+'</text>';
  return '<div class="chartbox"><svg viewBox="0 0 '+Wd+' '+H+'" width="100%" role="img" aria-label="'+esc(label)+'">'+g+'</svg></div>';
}
function calibCurve(){
  var t = obs().calib.hist.filter(function(h){ return h.t==="tf"; });
  if(t.length<10) return '<p class="small muted">La curva aparece con al menos 10 respuestas de verdadero o falso. Llevas '+t.length+'.</p>';
  var B = [50,60,70,80,90,100], Wd=400, H=220, ml=40, mr=14, mt=10, mb=26;
  function x(c){ return ml + (c-50)/50*(Wd-ml-mr); }
  function y(v){ return mt + (H-mt-mb)*(1-v/100); }
  var g = "";
  [0,25,50,75,100].forEach(function(v){ g += '<line x1="'+ml+'" x2="'+(Wd-mr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(ml-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'%</text>'; });
  g += '<line x1="'+x(50)+'" y1="'+y(50)+'" x2="'+x(100)+'" y2="'+y(100)+'" stroke="var(--muted)" stroke-dasharray="4 4"/>';
  var pts = [];
  B.forEach(function(c){ var s = t.filter(function(h){ return h.conf===c; }); g += '<text x="'+x(c)+'" y="'+(H-8)+'" text-anchor="middle">'+c+'%</text>'; if(!s.length) return; var p = s.filter(function(h){ return h.ok; }).length/s.length*100; pts.push([c,p,s.length]); });
  if(pts.length>1) g += '<path d="'+pts.map(function(p,i){ return (i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1); }).join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="2"/>';
  pts.forEach(function(p){ g += '<circle cx="'+x(p[0]).toFixed(1)+'" cy="'+y(p[1]).toFixed(1)+'" r="'+Math.min(9, 3+Math.sqrt(p[2]))+'" fill="var(--accent)"/><text x="'+(x(p[0])+10).toFixed(1)+'" y="'+(y(p[1])-8).toFixed(1)+'">'+p[2]+'</text>'; });

}

/* ---------- PROGRESO ---------- */
function chart(hist, color, label){
  var data = hist.slice(-30);
  if(data.length<2) return '<p class="small muted">'+label+': aparece cuando tengas al menos 2 rondas.</p>';
  var Wd=640, H=180, ml=34, mr=10, mt=12, mb=22;
  var max = 0; data.forEach(function(d){ max=Math.max(max,d.n,d.ok); });
  var step = max<=20?5:max<=50?10:20; max = Math.ceil(max/step)*step;
  function x(i){ return ml + i*(Wd-ml-mr)/(data.length-1); }
  function y(v){ return mt + (H-mt-mb)*(1-v/max); }
  var g = "";
  for(var v=0; v<=max; v+=step){ g += '<line x1="'+ml+'" x2="'+(Wd-mr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(ml-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>'; }
  var target = data.map(function(d,i){ return (i?"L":"M")+x(i).toFixed(1)+" "+y(d.n).toFixed(1); }).join(" ");
  var got = data.map(function(d,i){ return (i?"L":"M")+x(i).toFixed(1)+" "+y(d.ok).toFixed(1); }).join(" ");
  var area = got + " L"+x(data.length-1).toFixed(1)+" "+y(0)+" L"+x(0)+" "+y(0)+" Z";
  var last = data[data.length-1];
  g += '<path d="'+area+'" fill="'+color+'" fill-opacity=".12"/>';
  g += '<path d="'+target+'" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  g += '<path d="'+got+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round"/>';
  g += '<circle cx="'+x(data.length-1)+'" cy="'+y(last.ok)+'" r="4" fill="'+color+'"/>';
  g += '<text x="'+ml+'" y="'+(H-6)+'">ronda 1</text><text x="'+(Wd-mr)+'" y="'+(H-6)+'" text-anchor="end">ronda '+data.length+'</text>';
  return '<div class="chartbox"><svg viewBox="0 0 '+Wd+' '+H+'" width="100%" style="min-width:360px" role="img" aria-label="'+label+'">'+g+'</svg></div>';
}
var impMsg = "";
function renderProgreso(){
  var totalMin = 0, days = 0; for(var d in S.log){ totalMin += S.log[d].min; if(S.log[d].w+S.log[d].n+S.log[d].m+(S.log[d].o||0)>0) days++; }
  var bestW = 0; S.words.hist.forEach(function(h){ bestW=Math.max(bestW,h.ok); });
  var bestN = 0; S.nums.hist.forEach(function(h){ bestN=Math.max(bestN,h.ok); });
  var h = '<section class="view">';
  h += '<div class="panel"><div class="daybar">'
    + '<div class="stat"><h3>Días entrenados</h3><b class="mono">'+days+'</b><span class="muted small">'+Math.round(totalMin)+' min en total</span></div>'
    + '<div class="stat"><h3>Mejor lista</h3><b class="mono">'+bestW+'</b><span class="muted small">palabras en orden</span></div>'
    + '<div class="stat"><h3>Mejor número</h3><b class="mono">'+bestN+'</b><span class="muted small">dígitos</span></div>'
    + '</div></div>';
  h += '<div class="panel"><h3>Palabras por ronda</h3><div class="legend"><span><i style="background:var(--accent)"></i>recordadas</span><span><i style="background:var(--muted)"></i>mostradas</span></div>'+chart(S.words.hist,"var(--accent)","Palabras por ronda")+'</div>';
  h += '<div class="panel"><h3>Dígitos por ronda</h3>'+chart(S.nums.hist,"var(--brass)","Dígitos por ronda")+'</div>';
  h += '<div class="panel"><div class="row" style="justify-content:space-between"><div><h3>Copia de seguridad</h3><p class="small muted">Lleva tu progreso a otro dispositivo con un código.</p></div><button class="btn small" data-go="sync">Guardar / recuperar</button></div></div>'
    + obsProgressHTML() + '</section>';
  view.innerHTML = h;
  view.querySelectorAll("[data-go]").forEach(function(b){ b.onclick = function(){ go(b.getAttribute("data-go")); }; });
}
